<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ 粒子特效游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI','PingFang SC',sans-serif;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d',{alpha:false});
const bloomC=document.createElement('canvas'),BX=bloomC.getContext('2d');
let W,H,W2,H2,dpr;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;W2=W/2;H2=H/2;
  C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(dpr,0,0,dpr,0,0);
  bloomC.width=Math.floor(W*.5);bloomC.height=Math.floor(H*.5);
}
resize();addEventListener('resize',resize);

// ===== 主题 =====
const themes=[
  {name:'霓虹',hues:[0,60,120,180,240,300],accent:'#00e5ff',glow:'rgba(0,229,255,'},
  {name:'烈焰',hues:[0,12,25,38,50],accent:'#ff6600',glow:'rgba(255,102,0,'},
  {name:'深海',hues:[180,200,220,240,260],accent:'#00bbff',glow:'rgba(0,187,255,'},
  {name:'樱花',hues:[315,335,355,15,20],accent:'#ff69b4',glow:'rgba(255,105,180,'},
  {name:'极光',hues:[120,150,180,200,280],accent:'#00ff88',glow:'rgba(0,255,136,'},
  {name:'赛博',hues:[180,300,270,210,150],accent:'#bf00ff',glow:'rgba(191,0,255,'},
];
let theme=0;

// ===== 对象池 =====
const particlePool=[];
function getParticle(){
  return particlePool.pop()||{};
}
function releaseParticle(p){particlePool.push(p)}

// ===== 星空 =====
const starCount=Math.min(400,Math.floor(W*H/3000));
const stars=new Float32Array(starCount*5); // x,y,r,phase,speed
for(let i=0;i<starCount;i++){
  stars[i*5]=Math.random()*2500-250;
  stars[i*5+1]=Math.random()*2500-250;
  stars[i*5+2]=Math.random()*1.8+.15;
  stars[i*5+3]=Math.random()*6.28;
  stars[i*5+4]=Math.random()*.003+.0006;
}

const nebulae=[];
for(let i=0;i<7;i++)nebulae.push({x:Math.random(),y:Math.random(),r:120+Math.random()*380,hue:Math.random()*360,a:.015+Math.random()*.04,phase:Math.random()*6.28});

const auroras=[];
for(let i=0;i<3;i++)auroras.push({y:.08+Math.random()*.25,hue:Math.random()*360,amp:25+Math.random()*55,freq:.002+Math.random()*.003,speed:.25+Math.random()*.5,phase:Math.random()*6.28});

let globalTime=0;

function turbX(x,y,t){return Math.sin(y*.0025+t*.4)*.16+Math.cos(x*.0018+t*.35)*.1}
function turbY(x,y,t){return Math.cos(x*.0025+t*.5)*.16+Math.sin(y*.0018+t*.25)*.1}

// ===== 飘字 =====
const popups=[];
function addPopup(x,y,text,color,size){
  popups.push({x,y,text,color,size:size||22,life:55,maxLife:55,vy:-2.2,vx:(Math.random()-.5)*1.8});
}

// ===== 粒子数组 =====
const particles=[];
const MAX_PARTICLES=4000;

function addParticle(x,y,vx,vy,life,size,hue,type,opts){
  if(particles.length>=MAX_PARTICLES)return;
  const p=getParticle();
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;
  p.life=p.maxLife=life;p.size=size;p.hue=hue;
  p.gravity=opts&&opts.gravity!=null?opts.gravity:.05;
  p.drag=opts&&opts.drag!=null?opts.drag:.975;
  p.type=type||'dot';
  p.rot=Math.random()*6.28;
  p.rotV=(Math.random()-.5)*.12;
  p.shimmer=Math.random()*6.28;
  p.useTurb=!(opts&&opts.turbulence===false);
  p.angle=Math.atan2(vy,vx);
  p.sat=opts&&opts.sat!=null?opts.sat:100;
  p.gIdx=(Math.random()*8)|0;
  particles.push(p);
}

// ===== 冲击波 =====
const shockwaves=[];
function addShockwave(x,y,hue,maxR){
  shockwaves.push({x,y,hue,r:0,maxR:maxR||120+Math.random()*100,life:20+Math.random()*15,maxLife:35});
}

// ===== 光球 =====
class Orb{
  constructor(){this.reset();this.trail=[]}
  reset(){
    const side=(Math.random()*4)|0;
    if(side===0){this.x=-40;this.y=Math.random()*H}
    else if(side===1){this.x=W+40;this.y=Math.random()*H}
    else if(side===2){this.x=Math.random()*W;this.y=-40}
    else{this.x=Math.random()*W;this.y=H+40}
    const ang=Math.atan2(H2-this.y,W2-this.x)+(Math.random()-.5)*1.2;
    const spd=.5+Math.random()*2.5;
    this.vx=Math.cos(ang)*spd;this.vy=Math.sin(ang)*spd;
    this.r=10+Math.random()*20;
    const hues=themes[theme].hues;
    this.hue=hues[(Math.random()*hues.length)|0];
    this.pulse=Math.random()*6.28;
    this.trail.length=0;
    this.orbA=Math.random()*6.28;this.orbS=.018+Math.random()*.032;
  }
  update(){
    this.orbA+=this.orbS;
    this.x+=this.vx+Math.cos(this.orbA)*.5;
    this.y+=this.vy+Math.sin(this.orbA)*.5;
    this.pulse+=.046;
    if(this.trail.length>30)this.trail.shift();
    this.trail.push({x:this.x,y:this.y,r:this.r*.4,a:.35});
    for(let i=0;i<this.trail.length;i++){this.trail[i].a*=.93;this.trail[i].r*=.968}
    if(Math.random()<.25)addParticle(
      this.x+(Math.random()-.5)*14,this.y+(Math.random()-.5)*14,
      (Math.random()-.5)*.7,(Math.random()-.5)*.7-.1,
      14+Math.random()*22,1+Math.random()*2.2,
      this.hue+(Math.random()-.5)*15
    );
    if(this.x<-80||this.x>W+80||this.y<-80||this.y>H+80)this.reset();
  }
  draw(){
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i];
      X.globalAlpha=t.a*.18;
      const g=X.createRadialGradient(t.x,t.y,0,t.x,t.y,t.r);
      g.addColorStop(0,`hsla(${this.hue},88%,55%,.25)`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      X.fillStyle=g;X.beginPath();X.arc(t.x,t.y,t.r,0,6.2832);X.fill();
    }
    X.globalAlpha=1;
    const r=this.r+Math.sin(this.pulse)*4.5;
    // 光晕
    const glow=X.createRadialGradient(this.x,this.y,0,this.x,this.y,r*3.5);
    glow.addColorStop(0,`hsla(${this.hue},85%,50%,.07)`);
    glow.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=glow;X.beginPath();X.arc(this.x,this.y,r*3.5,0,6.2832);X.fill();
    // 核心
    const core=X.createRadialGradient(this.x-r*.1,this.y-r*.1,0,this.x,this.y,r);
    core.addColorStop(0,'rgba(255,255,255,.97)');
    core.addColorStop(.15,`hsla(${this.hue},100%,80%,.9)`);
    core.addColorStop(.5,`hsla(${this.hue},90%,48%,.45)`);
    core.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=core;X.beginPath();X.arc(this.x,this.y,r,0,6.2832);X.fill();
    // 脉冲环
    const pr=r*1.3+Math.sin(this.pulse*2.2)*3.5;
    X.strokeStyle=`hsla(${this.hue},100%,70%,${.06+.04*Math.sin(this.pulse*2.2)})`;
    X.lineWidth=.8;X.beginPath();X.arc(this.x,this.y,pr,0,6.2832);X.stroke();
  }
  hit(mx,my){return Math.hypot(mx-this.x,my-this.y)<this.r+18}
}

// ===== 状态 =====
const orbs=[];
for(let i=0;i<6;i++)orbs.push(new Orb());
let score=0,combo=0,lastHit=0;
let mouseX=0,mouseY=0,isDown=false;
let shake=0,flash=0,scoreDisplay=0;
let frameCount=0,fps=60,lastFps=performance.now();
let introAlpha=0;

// ===== 爆炸 =====
function explode(x,y,count,speed,hue){
  const bh=hue!=null?hue:Math.random()*360;
  const invSpeed=1/speed;
  for(let i=0;i<count;i++){
    const ang=Math.random()*6.2832;
    const v=speed*(.12+.88*Math.random());
    const r=Math.random();
    let type='dot';
    if(r<.08)type='spark';
    else if(r<.15)type='smoke';
    else if(r<.23)type='streak';
    else if(r<.27)type='glyph';
    else if(r<.29)type='heart';
    addParticle(x,y,
      Math.cos(ang)*v,Math.sin(ang)*v,
      25+Math.random()*65,.8+Math.random()*5.5,
      bh+(Math.random()-.5)*55,type
    );
  }
  addShockwave(x,y,bh,60+count*1.6);
  if(count>45)addShockwave(x,y,bh+35,100+count*2.2);
  if(count>100)addShockwave(x,y,bh-30,150+count*2.8);
  addParticle(x,y,0,0,10,38,bh,'dot',{gravity:0,drag:.86,turbulence:false});
  shake=Math.min(shake+count*.028,18);
  flash=Math.min(flash+count*.0035,.85);
}

function hitOrb(orb,chain){
  const now=Date.now();
  combo=chain?combo:now-lastHit<2000?combo+1:1;
  if(!chain)lastHit=now;
  const pts=(chain?5:10)*Math.max(combo,1);
  score+=pts;
  addPopup(orb.x,orb.y-25,combo>1?`+${pts} ×${combo}`:`+${pts}`,combo>1?'#ffaa00':'rgba(255,255,255,.9)',combo>3?30:20);
  explode(orb.x,orb.y,chain?35:72,11,orb.hue);
  if(!chain&&combo>=3){
    for(const other of orbs){
      if(other!==orb&&Math.hypot(other.x-orb.x,other.y-orb.y)<280)
        setTimeout(()=>hitOrb(other,true),70+Math.random()*160);
    }
  }
  orb.reset();
}

// ===== 输入 =====
function pointerDown(x,y){isDown=true;mouseX=x;mouseY=y;explode(x,y,45,9)}
function pointerMove(x,y){
  mouseX=x;mouseY=y;
  if(!isDown)return;
  const hues=themes[theme].hues;
  for(let i=0;i<3;i++){
    const r=Math.random();
    const type=r<.15?'spark':r<.23?'streak':r<.27?'glyph':r<.29?'heart':'dot';
    addParticle(
      x+(Math.random()-.5)*25,y+(Math.random()-.5)*25,
      (Math.random()-.5)*5.5,(Math.random()-.5)*5.5,
      16+Math.random()*38,1+Math.random()*4.5,
      hues[(Math.random()*hues.length)|0]+(Math.random()-.5)*35,type
    );
  }
  for(const orb of orbs)if(orb.hit(x,y))hitOrb(orb);
}
function pointerUp(){isDown=false}

C.addEventListener('mousedown',e=>pointerDown(e.clientX,e.clientY),{passive:true});
C.addEventListener('mousemove',e=>pointerMove(e.clientX,e.clientY),{passive:true});
C.addEventListener('mouseup',pointerUp,{passive:true});
C.addEventListener('mouseleave',pointerUp,{passive:true});
C.addEventListener('touchstart',e=>{e.preventDefault();pointerDown(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();pointerMove(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
C.addEventListener('touchend',pointerUp,{passive:true});
addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();explode(W2,H2,200,15)}
  const n=parseInt(e.key);
  if(n>=1&&n<=themes.length)theme=n-1;
});

// ===== 渲染粒子 =====
function drawParticle(p){
  const t=p.life/p.maxLife;
  const a=t*t;
  const s=p.size*(.1+.9*a);
  if(a<.01||s<.2)return;
  const br=50+30*Math.sin(p.shimmer);
  const col=`hsl(${p.hue},${p.sat}%,${br}%)`;
  X.globalAlpha=a;
  switch(p.type){
    case 'spark':
      X.shadowBlur=14;X.shadowColor=col;X.fillStyle=col;
      X.beginPath();
      for(let i=0;i<6;i++){
        const ang=i*1.0472+p.rot;
        const r=i&1?s:s*.22;
        X.lineTo(p.x+Math.cos(ang)*r,p.y+Math.sin(ang)*r);
      }
      X.closePath();X.fill();
      X.shadowBlur=0;break;
    case 'ring':
      X.strokeStyle=col;X.lineWidth=2.8*a;X.shadowBlur=20;X.shadowColor=col;
      X.beginPath();X.arc(p.x,p.y,s*3.2*(1.3-a),0,6.2832);X.stroke();
      X.shadowBlur=0;break;
    case 'smoke':{
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,s*1.5);
      g.addColorStop(0,`hsla(${p.hue},${p.sat-10}%,20%,${a*.25})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
      X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,s*1.5,0,6.2832);X.fill();break;}
    case 'streak':{
      const len=s*5;
      const cos=Math.cos(p.angle),sin=Math.sin(p.angle);
      const g=X.createLinearGradient(p.x-cos*len,p.y-sin*len,p.x+cos*len,p.y+sin*len);
      g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.42,col);g.addColorStop(1,'rgba(0,0,0,0)');
      X.fillStyle=g;
      X.beginPath();
      X.moveTo(p.x-cos*len,p.y-sin*len);
      X.lineTo(p.x+cos*len,p.y+sin*len);
      X.lineTo(p.x+cos*len-sin*s*.3,p.y+sin*len+cos*s*.3);
      X.lineTo(p.x-cos*len-sin*s*.3,p.y-sin*len+cos*s*.3);
      X.closePath();X.fill();break;}
    case 'glyph':
      X.shadowBlur=12;X.shadowColor=col;X.fillStyle=col;
      X.font=`bold ${(s*2)|0}px sans-serif`;
      X.textAlign='center';X.textBaseline='middle';
      X.fillText('✦✧◆●▲★♦☆'[p.gIdx],p.x,p.y);
      X.shadowBlur=0;break;
    case 'heart':
      X.shadowBlur=10;X.shadowColor=col;X.fillStyle=col;
      X.beginPath();
      X.moveTo(p.x,p.y+s*.35);
      X.bezierCurveTo(p.x-s,p.y-s*.15,p.x-s*.35,p.y-s,p.x,p.y-s*.25);
      X.bezierCurveTo(p.x+s*.35,p.y-s,p.x+s,p.y-s*.15,p.x,p.y+s*.35);
      X.fill();break;
    default:
      X.shadowBlur=8;X.shadowColor=col;
      const g2=X.createRadialGradient(p.x,p.y,0,p.x,p.y,s);
      g2.addColorStop(0,'rgba(255,255,255,.92)');
      g2.addColorStop(.22,col);
      g2.addColorStop(1,'rgba(0,0,0,0)');
      X.fillStyle=g2;X.beginPath();X.arc(p.x,p.y,s,0,6.2832);X.fill();
      X.shadowBlur=0;
  }
}

// ===== 主循环 =====
function loop(){
  globalTime+=.016;
  introAlpha=Math.min(introAlpha+.02,1);

  // 背景
  X.fillStyle='rgba(2,2,14,.1)';
  X.fillRect(0,0,W,H);

  const shk=shake>.1;
  if(shk){X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}

  // 极光
  for(const a of auroras){
    a.phase+=a.speed*.007;
    X.globalAlpha=.035;
    for(let x=0;x<W;x+=12){
      const y=a.y*H+Math.sin(x*a.freq+a.phase)*a.amp;
      X.fillStyle=`hsla(${a.hue+Math.sin(x*.001+a.phase*.5)*30},65%,42%,.5)`;
      X.fillRect(x,y-18,12,36);
    }
  }
  X.globalAlpha=1;

  // 星空
  for(let i=0;i<starCount;i++){
    const sx=stars[i*5],sy=stars[i*5+1],sr=stars[i*5+2];
    stars[i*5+3]+=stars[i*5+4];
    const alpha=(.08+.45*Math.abs(Math.sin(stars[i*5+3])));
    X.fillStyle=`rgba(200,215,255,${alpha})`;
    X.fillRect((sx+mouseX*.015)%(W+100)-50,(sy+mouseY*.015)%(H+100)-50,sr,sr);
  }

  // 星云
  for(const n of nebulae){
    n.phase+=.0004;
    const g=X.createRadialGradient(n.x*W,n.y*H,0,n.x*W,n.y*H,n.r);
    g.addColorStop(0,`hsla(${n.hue+Math.sin(n.phase)*22},45%,28%,${n.a})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=g;X.fillRect(n.x*W-n.r,n.y*H-n.r,n.r*2,n.r*2);
  }

  // 冲击波
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];
    sw.r+=(sw.maxR-sw.r)*.075;sw.life--;
    if(sw.life<=0){shockwaves.splice(i,1);continue}
    const a=(sw.life/sw.maxLife);const a2=a*a;
    X.globalAlpha=a2*.45;
    X.strokeStyle=`hsl(${sw.hue},100%,65%)`;X.lineWidth=3.5*a+.5;
    X.shadowBlur=22;X.shadowColor=`hsl(${sw.hue},100%,55%)`;
    X.beginPath();X.arc(sw.x,sw.y,sw.r,0,6.2832);X.stroke();
    X.shadowBlur=0;
    if(a2>.2){
      X.globalAlpha=a2*.18;X.lineWidth=1.2*a;
      X.beginPath();X.arc(sw.x,sw.y,sw.r*.65,0,6.2832);X.stroke();
    }
  }
  X.globalAlpha=1;

  // 光球
  for(const orb of orbs){orb.update();orb.draw()}

  // 粒子
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    if(p.useTurb){p.vx+=turbX(p.x,p.y,globalTime);p.vy+=turbY(p.x,p.y,globalTime)}
    p.vx*=p.drag;p.vy*=p.drag;p.vy+=p.gravity;
    p.x+=p.vx;p.y+=p.vy;
    p.life--;p.rot+=p.rotV;p.shimmer+=.14;
    if(p.type==='streak')p.angle=Math.atan2(p.vy,p.vx);
    if(p.life<=0){releaseParticle(particles.splice(i,1)[0]);continue}
    if(p.size>2.5&&p.type==='dot'){
      for(const orb of orbs)if(orb.hit(p.x,p.y)){hitOrb(orb);break}
    }
    drawParticle(p);
  }
  X.globalAlpha=1;

  // 飘字
  for(let i=popups.length-1;i>=0;i--){
    const pu=popups[i];
    pu.x+=pu.vx;pu.y+=pu.vy;pu.vy*=.96;pu.life--;
    if(pu.life<=0){popups.splice(i,1);continue}
    const t=pu.life/pu.maxLife;
    const a=t<.15?t/.15:1;
    const s=pu.size*(1+.15*(1-t));
    X.globalAlpha=a;
    X.font=`bold ${s|0}px "Segoe UI",sans-serif`;
    X.textAlign='center';X.textBaseline='middle';
    X.fillStyle=pu.color;X.shadowBlur=14;X.shadowColor=pu.color;
    X.fillText(pu.text,pu.x,pu.y);
    X.shadowBlur=0;
  }
  X.globalAlpha=1;

  // 环境粒子
  if(Math.random()<.055&&particles.length<850){
    const hues=themes[theme].hues;
    addParticle(
      Math.random()*W,Math.random()*H,
      (Math.random()-.5)*.12,(Math.random()-.5)*.12,
      140+Math.random()*140,.5+Math.random()*1.3,
      hues[(Math.random()*hues.length)|0],'dot',
      {gravity:.0004,drag:.9997}
    );
  }

  if(shk)X.restore();
  if(flash>.01){X.fillStyle=`rgba(255,255,255,${flash*.08})`;X.fillRect(0,0,W,H);flash*=.82}

  // BLOOM (半分辨率)
  BX.clearRect(0,0,bloomC.width,bloomC.height);
  BX.drawImage(C,0,0,bloomC.width,bloomC.height);
  X.save();
  X.globalCompositeOperation='lighter';
  X.globalAlpha=.18;
  X.filter='blur(4px)';
  X.drawImage(bloomC,0,0,W,H);
  X.filter='none';
  X.restore();

  drawHUD();

  frameCount++;
  const now=performance.now();
  if(now-lastFps>1000){fps=frameCount;frameCount=0;lastFps=now}
  if(Date.now()-lastHit>3000)combo=0;
  scoreDisplay+=(score-scoreDisplay)*.1;

  requestAnimationFrame(loop);
}

// ===== HUD =====
function drawHUD(){
  X.save();
  X.globalAlpha=introAlpha;

  // 顶部遮罩
  const tg=X.createLinearGradient(0,0,0,145);
  tg.addColorStop(0,'rgba(0,0,6,.6)');tg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=tg;X.fillRect(0,0,W,145);

  // 标题
  const titleY=42;
  X.font='bold 27px "Segoe UI",sans-serif';
  X.textAlign='left';X.textBaseline='alphabetic';
  const tG=X.createLinearGradient(18,0,310,0);
  tG.addColorStop(0,'#00e5ff');tG.addColorStop(.5,'#7c4dff');tG.addColorStop(1,'#ff4081');
  X.fillStyle=tG;X.shadowBlur=10;X.shadowColor='rgba(124,77,255,.25)';
  X.fillText('✦ 粒子特效游戏',18,titleY);
  X.shadowBlur=0;

  X.font='12.5px "Segoe UI",sans-serif';
  X.fillStyle='rgba(125,142,205,.48)';
  X.fillText('🖱️ 点击拖动爆炸 · 🎯 碰撞光球得分 · ⌨️ 1-6 换主题 · 空格 大爆炸',18,70);

  // 主题色
  const th=themes[theme];
  X.font='12px "Segoe UI",sans-serif';
  X.fillStyle=th.accent;X.shadowBlur=6;X.shadowColor=th.glow+'.4)';
  X.fillText(th.name,18,98);
  X.shadowBlur=0;
  for(let i=0;i<th.hues.length;i++){
    X.fillStyle=`hsl(${th.hues[i]},88%,56%)`;
    X.shadowBlur=6;X.shadowColor=`hsl(${th.hues[i]},88%,52%)`;
    X.beginPath();X.arc(72+i*21,94,5.5,0,6.2832);X.fill();
    X.shadowBlur=0;
  }

  // 分数
  X.textAlign='right';
  X.font='bold 50px "Segoe UI",sans-serif';
  const sG=X.createLinearGradient(W-250,15,W-18,15);
  sG.addColorStop(0,'#00e5ff');sG.addColorStop(1,'#ff4081');
  X.fillStyle=sG;
  X.shadowBlur=15;X.shadowColor='rgba(0,229,255,.18)';
  X.fillText(Math.round(scoreDisplay).toLocaleString(),W-18,58);
  X.shadowBlur=0;

  X.font='11.5px "Segoe UI",sans-serif';
  X.fillStyle='rgba(125,142,205,.32)';
  X.fillText('SCORE',W-18,78);

  // 连击
  if(combo>1&&Date.now()-lastHit<3000){
    const ca=Math.min(1,(3000-(Date.now()-lastHit))/1500);
    X.globalAlpha=ca*introAlpha;
    const sc=1+Math.sin(globalTime*10)*.06;
    X.save();X.translate(W-18,118);X.scale(sc,sc);
    X.font='bold 28px "Segoe UI",sans-serif';
    X.fillStyle='#ffaa00';X.shadowBlur=22;X.shadowColor='rgba(255,150,0,.5)';
    X.fillText(`🔥 ×${combo}`,0,0);
    X.restore();X.shadowBlur=0;
    // 进度条
    const bw=130,bh=4.5,bx=W-18-bw,by=132;
    const pct=Math.max(0,(3000-(Date.now()-lastHit))/3000);
    X.fillStyle='rgba(255,255,255,.05)';X.fillRect(bx,by,bw,bh);
    X.fillStyle='rgba(255,170,0,.8)';X.fillRect(bx,by,bw*pct,bh);
    X.fillStyle='rgba(255,170,0,.3)';X.fillRect(bx,by,bw*pct,bh*.35);
    X.globalAlpha=introAlpha;
  }

  // 底部
  X.textAlign='left';X.textBaseline='alphabetic';
  X.font='10.5px "Segoe UI",sans-serif';
  X.fillStyle='rgba(60,70,120,.22)';
  X.fillText(`FPS ${fps}  ·  粒子 ${particles.length}  ·  冲击波 ${shockwaves.length}`,18,H-12);
  X.restore();
}

loop();
</script>
</body>
</html>
